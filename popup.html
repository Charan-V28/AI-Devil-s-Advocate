<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0a0d14;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background: #f43f5e;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #e11d48;
    }
    .secondary-btn {
      background: #1f293d;
      color: #94a3b8;
    }
    .secondary-btn:hover {
      background: #334155;
      color: #fff;
    }
  </style>
</head>
<body>
  <h3>😈 AI Devil's Advocate</h3>
  <button id="openSidePanelBtn">📌 Dock to Side Panel</button>
  <script src="popup.js"></script>
</body>
</html>
