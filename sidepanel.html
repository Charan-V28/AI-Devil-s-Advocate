<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Devil's Advocate</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --accent: #f43f5e;
      --accent-hover: #e11d48;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100%;
      height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.65rem;
      background: rgba(244, 63, 94, 0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* Tab Buttons */
    .nav-tabs {
      display: flex;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .tab-content { display: none; flex-direction: column; gap: 12px; }
    .tab-content.active { display: flex; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea, input[type="password"] {
      width: 100%;
      background: #05070c;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.85rem;
      font-family: inherit;
    }

    textarea { resize: vertical; min-height: 80px; }

    .btn-action {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: #1f2937;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Range Slider */
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Output Results */
    .status-box {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .output-card {
      background: #05070c;
      border-left: 3px solid var(--accent);
      padding: 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">😈 DEVIL'S ADVOCATE <span class="badge">v1.0</span></div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" data-tab="tab-analyze">⚡ Analyze</button>
    <button class="tab-btn" data-tab="tab-settings">⚙️ Settings</button>
  </div>

  <!-- MAIN ANALYZE TAB -->
  <div id="tab-analyze" class="tab-content active">
    
    <div class="card">
      <div style="display:flex; justify-content: space-between; align-items:center;">
        <label for="claimText">Target Claim or Article</label>
        <button id="grabTextBtn" class="btn-secondary">🪄 Grab Selected</button>
      </div>
      <textarea id="claimText" placeholder="Paste claim or text to challenge..."></textarea>
    </div>

    <div class="card">
      <div class="slider-group">
        <label>Adversarial Stance: <span id="stanceLabel" style="color:var(--accent)">Academic Critic</span></label>
        <input type="range" id="stanceSlider" min="1" max="3" step="1" value="2">
        <div class="slider-labels">
          <span>Socratic</span>
          <span>Academic</span>
          <span>Aggressive</span>
        </div>
      </div>
    </div>

    <button id="analyzeBtn" class="btn-action">⚡ Deconstruct & Counter-Argue</button>

    <div class="card">
      <label>Counter-Analysis Output</label>
      <div id="status" class="status-box">Ready to analyze claims.</div>
      <div id="output" class="output-card" style="display: none;"></div>
    </div>

  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <label for="apiKeyInput">Gemini API Key</label>
      <input type="password" id="apiKeyInput" placeholder="Paste Gemini API key...">
      <button id="saveKeyBtn" class="btn-action" style="margin-top:6px;">Save API Key</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
